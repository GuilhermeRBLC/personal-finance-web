<div class="flex h-screen bg-slate-50 overflow-hidden">
  
  <aside class="w-64 bg-white border-r border-slate-100 flex flex-col justify-between">
    <div>
      <div class="p-6 border-b border-slate-50">
        <h1 class="text-xl font-extrabold text-emerald-600 tracking-tight flex items-center gap-2">
          <span>💲</span> Meu Dinheiro
        </h1>
      </div>

      <nav class="p-4 space-y-1">
        <a 
          routerLink="/dashboard" 
          routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold"
          class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl text-sm font-medium transition-all"
        >
          <span>📊</span> Dashboard
        </a>

        <a 
          routerLink="/accounts" 
          routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold"
          class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl text-sm font-medium transition-all"
        >
          <span>🏦</span> Contas
        </a>

        <a 
          routerLink="/transactions" 
          routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold"
          class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl text-sm font-medium transition-all"
        >
          <span>💸</span> Transações
        </a>
      </nav>
    </div>

    <div class="p-4 border-t border-slate-50">
      <a
        (click)="doLogout()"
        class="flex items-center gap-3 px-4 py-3 text-rose-600 hover:bg-rose-50 rounded-xl text-sm font-medium transition-all cursor-pointer"
      >
        <span>🚪</span> Sair do Sistema
      </a>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    
    <header class="h-16 bg-white border-b border-slate-100 flex items-center justify-end px-8">
      <div class="flex items-center gap-3">
        <div class="text-right">
          <p class="text-xs text-slate-400 font-medium">Olá, bem-vindo!</p>
          <p class="text-sm font-semibold text-slate-700">{{ userName }}</p>
        </div>
        <div class="w-10 h-10 bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center rounded-full text-sm">
          {{ userName.substring(0, 2).toUpperCase() }}
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-slate-50">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
