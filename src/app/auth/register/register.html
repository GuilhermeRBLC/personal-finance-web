<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-100">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-emerald-600 tracking-tight mb-2">💲 Meu Dinheiro</h1>
      <p class="text-slate-500 text-sm">Crie sua conta e comece a controlar suas finanças</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-5">
      
      <div>
        <label for="name" class="block text-sm font-semibold text-slate-700 mb-1.5">Nome Completo</label>
        <input 
          type="text" 
          id="name" 
          name="name"
          [(ngModel)]="registerData.name"
          required
          placeholder="Ex: João Silva" 
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white transition-all text-sm"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">E-mail</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          [(ngModel)]="registerData.email"
          required
          placeholder="seu@email.com" 
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white transition-all text-sm"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Senha</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          [(ngModel)]="registerData.password"
          required
          placeholder="••••••••" 
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white transition-all text-sm"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="!registerForm.form.valid"
        class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium rounded-xl shadow-sm shadow-emerald-200 transition-all text-sm mt-2"
      >
        Criar minha conta
      </button>
    </form>

    <div class="text-center mt-6 pt-5 border-t border-slate-100">
      <p class="text-sm text-slate-500">
        Já tem uma conta? 
        <a routerLink="/login" class="font-semibold text-emerald-600 hover:text-emerald-700 transition-all">Faça login</a>
      </p>
    </div>

  </div>
</div>
